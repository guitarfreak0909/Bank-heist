<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Night Shift Heist</title>
<style>
:root{--bg:#0b0d14;--fg:#e8e6df;--muted:#8d93a5;--accent:#f2c14e;--danger:#e5484d;--ok:#46c37b;--panel:#151a26;--line:#2a3247}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;background:rgba(5,7,12,.88);padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:5}
#ov.hide{display:none}
.panel{max-width:820px;width:100%;text-align:center;margin:auto}
/* touch controls */
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:3}
body.touch #touch{display:block}
body.menu #touch{display:none}
#stick{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none}
#stick::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px dashed rgba(242,193,78,.25)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(232,230,223,.35);pointer-events:none}
#knob.sprint{background:rgba(242,193,78,.75)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(21,26,38,.78);
  color:var(--fg);font:inherit;font-weight:700;font-size:11px;line-height:1.2;padding:0;width:56px;height:56px}
.tb:disabled{opacity:.35}
.tb.on{background:rgba(242,193,78,.45)}
#bAct{right:calc(22px + env(safe-area-inset-right));bottom:calc(32px + env(safe-area-inset-bottom));width:92px;height:92px;border-color:var(--accent);background:rgba(242,193,78,.18);font-size:13px}
#bAct.hot{background:rgba(242,193,78,.5);color:#fff}
/* item buttons sit on an arc around ACT */
#bSmoke{right:calc(140px + env(safe-area-inset-right));bottom:calc(50px + env(safe-area-inset-bottom))}
#bDecoy{right:calc(122px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom))}
#bDisg{right:calc(74px + env(safe-area-inset-right));bottom:calc(146px + env(safe-area-inset-bottom))}
#bEmp{right:calc(12px + env(safe-area-inset-right));bottom:calc(148px + env(safe-area-inset-bottom))}
#bPause{right:calc(10px + env(safe-area-inset-right));top:calc(72px + env(safe-area-inset-top));width:42px;height:42px;font-size:14px}
h1{font-size:clamp(28px,5vw,52px);margin:0 0 4px;color:var(--accent);letter-spacing:2px}
h2{font-size:clamp(20px,3vw,30px);margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:6px 0}
.keys{display:inline-grid;grid-template-columns:auto auto;gap:4px 14px;text-align:left;margin:12px 0;color:var(--fg);font-size:14px}
.keys b{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.cards.crew{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;transition:transform .1s,border-color .1s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}
.card:disabled{opacity:.4;cursor:default}
.card .n{font-weight:700;color:var(--accent);margin-bottom:6px}
.card .d{font-size:13px;color:var(--muted)}
.card .c{margin-top:10px;font-size:13px}
button.go{background:var(--accent);color:#1a1405;border:0;border-radius:8px;padding:12px 26px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
button.go:hover{filter:brightness(1.1)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;margin:8px 4px 0}
.stat{color:var(--fg)}
.money{color:var(--ok)}
.bad{color:var(--danger)}
.unlock{color:var(--accent);font-weight:700}
@media (max-width:520px){.cards{grid-template-columns:1fr 1fr}.card{padding:10px}.card .d{font-size:12px}h2{margin-bottom:4px}.keys{font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button class="tb" id="bAct">ACT</button>
  <button class="tb" id="bSmoke">SMOKE<br>1</button>
  <button class="tb" id="bDecoy">DECOY<br>0</button>
  <button class="tb" id="bDisg">DISG<br>0</button>
  <button class="tb" id="bEmp">EMP<br>0</button>
  <button class="tb" id="bPause">II</button>
</div>
<div id="ov"><div class="panel" id="panel"></div></div>
<script>
// ---------- constants & helpers ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), panel = document.getElementById('panel');
const T = 32, W = 32, H = 20;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const angDiff = (a,b) => { let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; };
const fmt = n => '$' + Math.round(n).toLocaleString();
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

// ---------- layout / camera ----------
let TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const V = {w:0,h:0,dpr:1,hud:60,vx:0,vy:60,vw:0,vh:0,scale:1,narrow:false};
function layout(){
  V.dpr = Math.min(window.devicePixelRatio||1, 2);
  V.w = innerWidth; V.h = innerHeight;
  cv.width = Math.round(V.w*V.dpr); cv.height = Math.round(V.h*V.dpr);
  V.narrow = V.w < 700;
  V.hud = V.narrow ? 62 : 60;
  const portraitTouch = TOUCH && V.h > V.w;
  const ctrl = portraitTouch ? 220 : 0;           // controls sit under the map in portrait
  V.vx = 0; V.vy = V.hud; V.vw = V.w; V.vh = Math.max(120, V.h - V.hud - ctrl);
  const fit = Math.min(V.vw/(W*T), V.vh/(H*T));
  V.scale = TOUCH ? Math.max(fit, 0.85) : Math.min(fit, 1.6);
  document.body.classList.toggle('touch', TOUCH);
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));

// ---------- audio (synthesized, no files) ----------
let AC = null, muted = store.get('nsh_mute','0')==='1';
function audioOn(){
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { return; } }
  if (AC.state==='suspended') AC.resume();
}
function tone(freq, dur, type='square', vol=0.06, slide=0, delay=0){
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf = null;
function hiss(dur, vol=0.1, freq=1000){
  if (!AC || muted) return;
  if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d=noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf; f.type='lowpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+dur);
}
const SFX = {
  cash:   () => { tone(880,.07,'square',.05); tone(1320,.1,'square',.045,0,.06); },
  vault:  () => [523,659,784,1046].forEach((f,i)=>tone(f,.2,'square',.05,0,i*.09)),
  drill:  () => tone(120+Math.random()*30,.22,'sawtooth',.035,40),
  pick:   () => tone(2200+Math.random()*900,.025,'square',.025),
  unlock: () => { tone(600,.06,'square',.05); tone(900,.09,'square',.05,0,.07); },
  caught: () => { tone(220,.35,'sawtooth',.1,-160); hiss(.25,.15,500); },
  smoke:  () => hiss(.8,.12,900),
  emp:    () => tone(1600,.45,'sine',.08,-1450),
  decoy:  () => tone(1250,.06,'square',.05),
  throw:  () => tone(500,.12,'triangle',.05,300),
  bark:   () => { tone(330,.08,'sawtooth',.08,-140); tone(310,.09,'sawtooth',.07,-140,.13); },
  laser:  () => tone(1900,.3,'square',.07,-1200),
  escape: () => [392,523,659,784,1046].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.08)),
  disg:   () => tone(300,.3,'triangle',.06,400),
  huh:    () => tone(520,.12,'triangle',.05,180),
  siren:  () => { tone(700,.42,'sawtooth',.03,260); tone(960,.42,'sawtooth',.03,-260,.45); },
  click:  () => tone(520,.04,'square',.03),
  bust:   () => [392,330,262,196].forEach((f,i)=>tone(f,.25,'sawtooth',.06,0,i*.18)),
};
addEventListener('pointerdown', audioOn, {capture:true});
addEventListener('keydown', audioOn, {capture:true});

// ---------- data ----------
const BANKS = ['First Local Savings','Harbor Credit Union','Midtown Trust','Goldline Investment Bank','The Federal Vault'];
const UPG = [
  {id:'shoes',   name:'Soft Sneakers',     desc:'+15% move speed',                cost:1500, apply:g=>g.speed*=1.15},
  {id:'bag',     name:'Reinforced Duffel', desc:'Loot slows you 40% less',        cost:2000, apply:g=>g.bagMult*=0.6},
  {id:'drill',   name:'Thermal Drill',     desc:'Crack vaults 40% faster',        cost:2000, apply:g=>g.crack*=0.6},
  {id:'picks',   name:'Lockpick Set',      desc:'Pick locked doors 3x faster',    cost:1000, apply:g=>g.pick*=0.34},
  {id:'smoke',   name:'Smoke Bombs x2',    desc:'Cloud that blinds guards, dogs & cameras', cost:1000, apply:g=>g.smoke+=2},
  {id:'decoy',   name:'Decoys x2',         desc:'Throw a beeper that pulls guards away', cost:1000, apply:g=>g.decoy+=2},
  {id:'disg',    name:'Guard Uniform',     desc:'8s where guards & cameras barely notice you (dogs still smell you)', cost:1500, apply:g=>g.disguise+=1},
  {id:'emp',     name:'EMP Charge',        desc:'Kill cameras & lasers for 10s',  cost:1200, apply:g=>g.emp+=1},
  {id:'kevlar',  name:'Kevlar Vest',       desc:'+1 life',                        cost:2500, apply:g=>g.lives+=1},
  {id:'shadow',  name:'Shadow Training',   desc:'Get spotted 25% slower',         cost:2500, apply:g=>g.stealth*=0.75},
  {id:'dispatch',name:'Bribed Dispatcher', desc:'+12s before police arrive',      cost:1500, apply:g=>g.policeBonus+=12},
  {id:'quiet',   name:'Silent Steps',      desc:'Sprinting makes 50% less noise', cost:1200, apply:g=>g.quiet*=0.5},
  {id:'intel',   name:'Inside Man',        desc:'+25% value on all loot',         cost:3000, apply:g=>g.lootMult*=1.25},
];
const CREW = [
  {id:'rookie', name:'The Rookie',     need:0,      desc:'2 lives, a smoke bomb and a decoy. A solid all-rounder.', apply:g=>{}},
  {id:'ghost',  name:'The Ghost',      need:15000,  desc:'Spotted 25% slower, 2 guard uniforms, but only 1 life.', apply:g=>{g.stealth*=0.75; g.disguise+=2; g.lives=1;}},
  {id:'muscle', name:'The Muscle',     need:35000,  desc:'3 lives and loot barely slows you, but a step slower.', apply:g=>{g.lives=3; g.bagMult*=0.5; g.speed*=0.92;}},
  {id:'techie', name:'The Techie',     need:60000,  desc:'2 EMPs. Cracks vaults and picks locks 30% faster.', apply:g=>{g.emp+=2; g.crack*=0.7; g.pick*=0.7;}},
  {id:'master', name:'The Mastermind', need:100000, desc:'+2 decoys, 1 EMP, 1 uniform and +15% on all loot.', apply:g=>{g.decoy+=2; g.emp+=1; g.disguise+=1; g.lootMult*=1.15;}},
];

let G = null;     // run state
let L = null;     // level state
let grid = null;  // tile grid: 1 = wall
let state = 'title';
const keys = {};
let best = +store.get('nsh_best', 0) || 0;

// ---------- map ----------
const wall = (x,y) => { const tx=Math.floor(x), ty=Math.floor(y); return tx<0||ty<0||tx>=W||ty>=H||grid[ty][tx]===1; };
const lockedAt = (x,y) => { const d = L && L.doorMap.get(Math.floor(y)*W+Math.floor(x)); return !!(d && d.locked); };
const solid = (x,y) => wall(x,y) || lockedAt(x,y);    // what blocks the player
const hitsWall = (x,y,r) => wall(x-r,y-r)||wall(x+r,y-r)||wall(x-r,y+r)||wall(x+r,y+r);
const hitsSolid = (x,y,r) => solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
const center = r => ({x:Math.floor(r.x+r.w/2), y:Math.floor(r.y+r.h/2)});
const randTile = r => ({x:ri(r.x,r.x+r.w-1), y:ri(r.y,r.y+r.h-1)});

function carveCorridor(a,b){
  let x=a.x, y=a.y;
  const stepX = () => { while(x!==b.x){ grid[y][x]=0; x+=Math.sign(b.x-x); } };
  const stepY = () => { while(y!==b.y){ grid[y][x]=0; y+=Math.sign(b.y-y); } };
  if (Math.random()<0.5){ stepX(); stepY(); } else { stepY(); stepX(); }
  grid[y][x]=0;
}

function bfs(sx,sy,tx,ty){
  if (sx===tx && sy===ty) return [{x:tx,y:ty}];
  const prev = new Int32Array(W*H).fill(-1);
  const s = sy*W+sx, t = ty*W+tx;
  const q=[s]; prev[s]=s; let h=0;
  while (h<q.length){
    const c=q[h++]; if (c===t) break;
    const cx=c%W, cy=(c/W)|0;
    for (const [dx,dy] of DIRS){
      const nx=cx+dx, ny=cy+dy;
      if (nx<0||ny<0||nx>=W||ny>=H||grid[ny][nx]) continue;
      const n=ny*W+nx; if (prev[n]!==-1) continue;
      prev[n]=c; q.push(n);
    }
  }
  if (prev[t]===-1) return null;
  const path=[]; let c=t;
  while (c!==s){ path.push({x:c%W, y:(c/W)|0}); c=prev[c]; }
  return path.reverse();
}

function floodDist(sx,sy){
  const d = new Int32Array(W*H).fill(-1); const q=[sy*W+sx]; d[sy*W+sx]=0; let h=0;
  while (h<q.length){ const c=q[h++], cx=c%W, cy=(c/W)|0;
    for (const [dx,dy] of DIRS){ const nx=cx+dx, ny=cy+dy;
      if (nx<0||ny<0||nx>=W||ny>=H||grid[ny][nx]) continue;
      const n=ny*W+nx; if (d[n]!==-1) continue; d[n]=d[c]+1; q.push(n); } }
  return d;
}

// floor tiles just outside a room's edge (not corners): the ways in
function entrances(r){
  const out=[];
  const chk=(x,y)=>{ if (x>=0&&y>=0&&x<W&&y<H&&!grid[y][x]) out.push({x,y}); };
  for (let x=r.x;x<r.x+r.w;x++){ chk(x,r.y-1); chk(x,r.y+r.h); }
  for (let y=r.y;y<r.y+r.h;y++){ chk(r.x-1,y); chk(r.x+r.w,y); }
  return out;
}

function makeGuard(rooms){
  const route = shuffle(rooms.slice()).slice(0, ri(2,3)).map(randTile);
  const s = route[0];
  return {x:s.x+0.5, y:s.y+0.5, face:Math.random()*6, route, ri:0, path:[], state:'patrol',
          target:null, lookT:0, blind:0, repath:0, cd:0, sees:false};
}

function genLevel(){
  const f = G.floor, boss = f===BANKS.length-1;
  let rooms;
  do {
    grid = Array.from({length:H}, () => Array(W).fill(1));
    rooms = [];
    let tries = 0;
    const want = 7 + Math.min(f,3);
    while (rooms.length < want && tries < 400){
      tries++;
      const w=ri(4,8), h=ri(3,6), x=ri(1,W-w-1), y=ri(1,H-h-1);
      if (rooms.some(o => x-1 < o.x+o.w && x+w+1 > o.x && y-1 < o.y+o.h && y+h+1 > o.y)) continue;
      rooms.push({x,y,w,h});
    }
  } while (rooms.length < 6);
  for (const r of rooms) for (let y=r.y;y<r.y+r.h;y++) for (let x=r.x;x<r.x+r.w;x++) grid[y][x]=0;
  rooms.sort((a,b)=>a.x-b.x);
  for (let i=1;i<rooms.length;i++) carveCorridor(center(rooms[i-1]), center(rooms[i]));
  for (let i=0;i<2;i++){ const a=ri(1,rooms.length-1), b=ri(1,rooms.length-1); if (a!==b) carveCorridor(center(rooms[a]), center(rooms[b])); }

  const start = rooms[0], others = rooms.slice(1);
  const van = {x:start.x+0.5, y:start.y+0.5};
  const player = {x:start.x+1.5, y:start.y+Math.min(1.5,start.h-0.5), weight:0, carry:0, face:0, slowT:0};

  // vault = farthest room from the van
  const d = floodDist(start.x, start.y);
  let vault = rooms[1], vd = -1;
  for (const r of others){ const c=center(r), v=d[c.y*W+c.x]; if (v>vd){vd=v; vault=r;} }
  const vc = center(vault);
  const total = Math.round(ri(3000,5000)*(1+f*0.7)*(boss?1.6:1)*G.lootMult/10)*10;
  const safe = {x:vc.x+0.5, y:vc.y+0.5, done:false, prog:0, stage:0, stages:boss?2:1, val:total, drillT:0};

  // cash
  const cash = [];
  for (const r of others){
    const n = r===vault ? ri(2,3) : ri(0,2);
    for (let i=0;i<n;i++){
      const t=randTile(r), x=t.x+0.5, y=t.y+0.5;
      if (Math.abs(x-safe.x)<1 && Math.abs(y-safe.y)<1) continue;
      cash.push({x,y,val:Math.round(ri(300,800)*(1+f*0.6)*G.lootMult/10)*10, taken:false, bob:Math.random()*6});
    }
  }

  // locked glass doors (guards have keys; you have to pick them)
  const doors=[], doorMap=new Map();
  const lockRooms = [];
  if (f>=1) lockRooms.push(vault);
  for (const r of shuffle(others.filter(r=>r!==vault)).slice(0, Math.min(f,2))) lockRooms.push(r);
  for (const r of lockRooms){
    const ents = entrances(r);
    if (!ents.length || ents.length>4) continue;
    for (const e of ents){ if (doorMap.has(e.y*W+e.x)) continue; const dr={x:e.x,y:e.y,locked:true,prog:0}; doors.push(dr); doorMap.set(e.y*W+e.x,dr); }
  }

  // guards, cameras
  const guards = [];
  for (let i=0;i<Math.min(2+f,6);i++) guards.push(makeGuard(others));
  const cams = [];
  for (const r of shuffle(others.slice()).slice(0,Math.min(1+f,5))){
    const cx = Math.random()<.5 ? r.x : r.x+r.w-1, cy = Math.random()<.5 ? r.y : r.y+r.h-1;
    const c = center(r);
    cams.push({x:cx+0.5, y:cy+0.5, base:Math.atan2(c.y-cy, c.x-cx), ang:0, ph:Math.random()*6, sees:false});
  }

  // laser grids: pulse on and off across a whole room
  const lasers = [];
  const lCount = f===0 ? 0 : Math.min(f,3) + (boss?1:0);
  for (const r of shuffle(others.slice()).slice(0,lCount)){
    const horiz = Math.random()<0.5;
    if (horiz){ const y=ri(r.y, r.y+r.h-1); lasers.push({horiz, c:y+0.5, a:r.x, b:r.x+r.w, on:2, off:1.6, ph:Math.random()*3.6, cd:0}); }
    else      { const x=ri(r.x, r.x+r.w-1); lasers.push({horiz, c:x+0.5, a:r.y, b:r.y+r.h, on:2, off:1.6, ph:Math.random()*3.6, cd:0}); }
  }

  // guard dogs: they smell you through disguises, and their barks carry
  const dogs = [];
  for (let i=0;i<Math.min(Math.max(0,f-1),2);i++){
    const t = randTile(pick(others));
    dogs.push({x:t.x+0.5, y:t.y+0.5, face:0, path:[], state:'wander', repath:0, barkT:0, lost:0, blind:0});
  }

  L = {rooms, others, start, van, player, safe, cash, guards, cams, doors, doorMap, lasers, dogs, decoys:[], boss,
       smokes:[], rings:[], texts:[], det:0, alarm:false, alarmEver:false, police:0, empT:0, disgT:0, time:0,
       lastKnown:null, noiseT:0, sirenT:0, huhT:0, pickT:0, flash:0, actTarget:null};
}

// ---------- vision ----------
function inSmoke(x,y){ for (const s of L.smokes) if (Math.hypot(x-s.x,y-s.y) < s.r) return true; return false; }
function los(ax,ay,bx,by){
  const d=Math.hypot(bx-ax,by-ay), n=Math.ceil(d/0.1);
  for (let i=1;i<n;i++){ const x=ax+(bx-ax)*i/n, y=ay+(by-ay)*i/n; if (wall(x,y) || inSmoke(x,y)) return false; }
  return true;
}
function canSee(o, face, range, half, p){
  const d = dist(o,p); if (d > range) return false;
  if (d > 0.7 && Math.abs(angDiff(face, Math.atan2(p.y-o.y, p.x-o.x))) > half) return false;
  return los(o.x,o.y,p.x,p.y);
}
function conePoly(o, face, range, half){
  const pts=[[o.x,o.y]], N=22;
  for (let k=0;k<=N;k++){
    const a = face-half + 2*half*k/N, cx=Math.cos(a), cy=Math.sin(a);
    let t=0; while (t<range){ t+=0.12; const x=o.x+cx*t, y=o.y+cy*t; if (wall(x,y)||inSmoke(x,y)) break; }
    pts.push([o.x+cx*t, o.y+cy*t]);
  }
  return pts;
}
const G_RANGE = 5.5, G_HALF = 0.62, C_RANGE = 5, C_HALF = 0.42, DOG_NOSE = 2.8;
const laserPhase = l => (L.time + l.ph) % (l.on + l.off);
const laserOn = l => L.empT<=0 && laserPhase(l) < l.on;

// ---------- events ----------
function say(x,y,txt,color='#e8e6df'){ L.texts.push({x,y,txt,color,t:1.4}); }
function noise(x,y,r){
  L.rings.push({x,y,r,t:0});
  for (const g of L.guards){
    if (g.blind>0 || dist(g,{x,y})>r) continue;
    if (L.alarm){ g.state='chase'; L.lastKnown={x,y}; }
    else if (g.state!=='chase'){ g.state='investigate'; g.target={x:Math.floor(x),y:Math.floor(y)}; g.path=bfs(Math.floor(g.x),Math.floor(g.y),g.target.x,g.target.y)||[]; }
  }
}
function triggerAlarm(){
  if (L.alarm) return;
  L.alarm = L.alarmEver = true;
  L.police = Math.max(18, 45 - G.floor*5 + G.policeBonus);
  L.lastKnown = {x:L.player.x, y:L.player.y};
  L.sirenT = 0;
  for (const g of L.guards){ g.state='chase'; g.repath=0; }
  say(L.player.x, L.player.y-1, 'ALARM!', '#e5484d');
}
function caught(){
  G.lives--;
  L.flash = 0.6;
  SFX.caught();
  if (G.lives <= 0){ endRun(false, 'A guard tackled you. Cuffs on.'); return; }
  const p = L.player;
  const lost = Math.round(p.carry/2);
  p.carry -= lost; p.weight = Math.ceil(p.weight/2); p.slowT = 0;
  p.x = L.start.x+1.5; p.y = L.start.y+Math.min(1.5,L.start.h-0.5);
  for (const o of L.guards) o.cd = 2.5;
  triggerAlarm();
  say(p.x, p.y-1, lost>0 ? `Broke free! Dropped ${fmt(lost)}` : 'Broke free!', '#e5484d');
}
function nearestLockedDoor(p, r){
  let best=null, bd=r;
  for (const d of L.doors){ if (!d.locked) continue; const dd=Math.hypot(d.x+0.5-p.x, d.y+0.5-p.y); if (dd<bd){bd=dd; best=d;} }
  return best;
}

// ---------- update ----------
function moveAlong(g, speed, dt){
  if (!g.path || !g.path.length) return true;
  const n = g.path[0], tx=n.x+0.5, ty=n.y+0.5;
  const dx=tx-g.x, dy=ty-g.y, d=Math.hypot(dx,dy);
  g.face += angDiff(g.face, Math.atan2(dy,dx)) * Math.min(1, dt*8);
  if (d <= speed*dt){ g.x=tx; g.y=ty; g.path.shift(); return !g.path.length; }
  g.x += dx/d*speed*dt; g.y += dy/d*speed*dt;
  return false;
}

function update(dt){
  L.time += dt;
  const p = L.player, f = G.floor;
  // --- player movement
  let mx=0,my=0;
  if (keys.KeyW||keys.ArrowUp) my--; if (keys.KeyS||keys.ArrowDown) my++;
  if (keys.KeyA||keys.ArrowLeft) mx--; if (keys.KeyD||keys.ArrowRight) mx++;
  let analog = 1, stickSprint = false;
  if (stick.active && stick.mag > 0.15){ mx = stick.x; my = stick.y; analog = Math.min(1, stick.mag/0.7); stickSprint = stick.mag > 0.93; }
  const sprint = keys.ShiftLeft||keys.ShiftRight||stickSprint;
  const moving = mx||my;
  if (p.slowT>0) p.slowT -= dt;
  if (moving){
    const m = Math.hypot(mx,my); mx/=m; my/=m; p.face=Math.atan2(my,mx);
    const slow = Math.max(0.45, 1 - p.weight*0.045*G.bagMult) * (p.slowT>0 ? 0.5 : 1);
    const sp = 3.4 * G.speed * slow * (sprint?1.6:analog);
    const nx=p.x+mx*sp*dt; if (!hitsSolid(nx,p.y,0.3)) p.x=nx;
    const ny=p.y+my*sp*dt; if (!hitsSolid(p.x,ny,0.3)) p.y=ny;
    if (sprint){ L.noiseT += dt; if (L.noiseT>0.4){ L.noiseT=0; noise(p.x,p.y,3.4*G.quiet); } }
  }
  // --- cash pickup
  for (const c of L.cash) if (!c.taken && dist(c,p)<0.6){ c.taken=true; p.carry+=c.val; p.weight+=1; say(c.x,c.y,'+'+fmt(c.val),'#46c37b'); SFX.cash(); }
  // --- hold-to-act: vault first, then the nearest locked door
  const s = L.safe;
  const acting = keys.KeyE||keys.Space||touchAct;
  L.actTarget = (!s.done && dist(s,p)<1.2) ? 'safe' : nearestLockedDoor(p, 1.15);
  if (acting && L.actTarget==='safe'){
    const time = (s.stage===0 ? 4.5 : 6.5) * G.crack;
    s.prog += dt/time;
    s.drillT += dt; if (s.drillT>0.25){ s.drillT=0; SFX.drill(); if (Math.random()<0.22) noise(s.x,s.y,s.stage?5:3.6); }
    if (s.prog>=1){
      const part = s.stages===2 ? Math.round(s.val/2) : s.val;
      p.carry += part; p.weight += s.stages===2 ? 2 : 4; SFX.vault();
      s.stage++; s.prog=0;
      if (s.stage>=s.stages){ s.done=true; say(s.x,s.y-0.6,'VAULT +'+fmt(part),'#f2c14e'); }
      else {
        say(s.x,s.y-0.6,'OUTER DOOR +'+fmt(part)+' · inner vault next','#f2c14e');
        for (let i=0;i<2;i++){ const g=makeGuard(L.others); L.guards.push(g); if (L.alarm) g.state='chase'; }
        say(s.x,s.y+1.2,'Reinforcements inbound','#e5484d');
      }
    }
  } else if (acting && L.actTarget){
    const d = L.actTarget;
    d.prog += dt/(2.4*G.pick);
    L.pickT += dt; if (L.pickT>0.14){ L.pickT=0; SFX.pick(); }
    if (d.prog>=1){ d.locked=false; SFX.unlock(); say(d.x+0.5,d.y,'UNLOCKED','#f2c14e'); }
  }
  // --- timers
  if (L.empT>0) L.empT-=dt;
  if (L.disgT>0) L.disgT-=dt;
  if (L.huhT>0) L.huhT-=dt;
  for (const sm of L.smokes) sm.t-=dt;
  L.smokes = L.smokes.filter(sm=>sm.t>0);
  for (const r of L.rings) r.t+=dt; L.rings = L.rings.filter(r=>r.t<0.6);
  for (const t of L.texts){ t.t-=dt; t.y-=dt*0.8; } L.texts = L.texts.filter(t=>t.t>0);
  if (L.flash>0) L.flash-=dt;

  const disg = L.disgT>0 ? 0.2 : 1;
  let detRate = 0;
  // --- lasers
  for (const l of L.lasers){
    if (l.cd>0) l.cd-=dt;
    if (!laserOn(l)) continue;
    const hit = l.horiz ? (Math.abs(p.y-l.c)<0.32 && p.x>l.a && p.x<l.b) : (Math.abs(p.x-l.c)<0.32 && p.y>l.a && p.y<l.b);
    if (hit && l.cd<=0){
      l.cd = 2; SFX.laser();
      if (!L.alarm){ triggerAlarm(); say(p.x,p.y-1.6,'LASER TRIPPED','#e5484d'); }
      else L.lastKnown = {x:p.x,y:p.y};
    }
  }
  // --- cameras
  for (const c of L.cams){
    c.ang = c.base + Math.sin(L.time*0.7 + c.ph)*0.85;
    c.sees = L.empT<=0 && canSee(c, c.ang, C_RANGE, C_HALF, p);
    if (c.sees){ if (L.alarm) L.lastKnown={x:p.x,y:p.y}; else detRate += 0.9*disg; }
  }
  // --- guards
  const gSpeed = {patrol:1.5+f*0.1, investigate:2.2+f*0.1, chase:3.1+f*0.15};
  for (const g of L.guards){
    if (g.cd>0) g.cd-=dt;
    if (g.blind>0){ g.blind-=dt; g.sees=false; g.face+=dt*3; continue; }
    if (L.smokes.some(sm=>Math.hypot(g.x-sm.x,g.y-sm.y)<sm.r)){ g.blind=Math.max(g.blind,1.5); continue; }
    g.sees = canSee(g, g.face, G_RANGE, G_HALF, p);
    if (g.sees){
      if (L.alarm){ g.state='chase'; L.lastKnown={x:p.x,y:p.y}; }
      else {
        const close = 1 - dist(g,p)/G_RANGE;
        detRate += (1.0 + close*2.2)*disg;
        if (disg===1) g.face += angDiff(g.face, Math.atan2(p.y-g.y,p.x-g.x))*Math.min(1,dt*4);
      }
    }
    if (g.cd<=0 && dist(g,p)<0.62 && (L.alarm || disg===1)){ caught(); if (state!=='play') return; continue; }

    const gt = {x:Math.floor(g.x), y:Math.floor(g.y)};
    if (g.state==='patrol'){
      if (!L.alarm && L.det>0.25 && g.sees && disg===1) continue; // stops and stares
      if (moveAlong(g, gSpeed.patrol, dt)){
        g.ri = (g.ri+1)%g.route.length; const w=g.route[g.ri];
        g.path = bfs(gt.x,gt.y,w.x,w.y)||[];
      }
    } else if (g.state==='investigate'){
      if (moveAlong(g, gSpeed.investigate, dt)){ g.state='look'; g.lookT=2.2; }
    } else if (g.state==='look'){
      g.face += dt*2.4; g.lookT-=dt;
      if (g.lookT<=0){
        if (L.alarm){ const c=center(pick(L.others)); g.state='investigate'; g.path=bfs(gt.x,gt.y,c.x,c.y)||[]; }
        else { g.state='patrol'; const w=g.route[g.ri]; g.path=bfs(gt.x,gt.y,w.x,w.y)||[]; }
      }
    } else if (g.state==='chase'){
      g.repath -= dt;
      if (g.repath<=0){
        g.repath=0.35;
        const tgt = g.sees ? p : L.lastKnown;
        if (tgt) g.path = bfs(gt.x,gt.y,Math.floor(tgt.x),Math.floor(tgt.y))||[];
      }
      if (g.sees && g.path.length<=1){
        const dx=p.x-g.x, dy=p.y-g.y, d=Math.hypot(dx,dy)||1, sp=gSpeed.chase*dt;
        if (!hitsWall(g.x+dx/d*sp,g.y,0.25)) g.x+=dx/d*sp;
        if (!hitsWall(g.x,g.y+dy/d*sp,0.25)) g.y+=dy/d*sp;
        g.face=Math.atan2(dy,dx);
      } else if (moveAlong(g, gSpeed.chase, dt) && !g.sees){ g.state='look'; g.lookT=1.5; }
    }
  }
  // --- dogs
  for (const d of L.dogs){
    if (d.blind>0){ d.blind-=dt; d.face+=dt*5; continue; }
    if (L.smokes.some(sm=>Math.hypot(d.x-sm.x,d.y-sm.y)<sm.r)){ d.blind=1.5; d.state='wander'; d.path=[]; continue; }
    const dp = dist(d,p);
    const smells = dp < DOG_NOSE && los(d.x,d.y,p.x,p.y);
    const dt0 = {x:Math.floor(d.x), y:Math.floor(d.y)};
    if (smells){
      d.state='track'; d.lost=0;
      d.barkT -= dt;
      if (d.barkT<=0){
        d.barkT=0.9; SFX.bark(); noise(d.x,d.y,5);
        if (!L.alarm) L.det += 0.3*G.stealth; else L.lastKnown={x:p.x,y:p.y};
      }
    }
    if (d.state==='track'){
      if (!smells){ d.lost+=dt; if (d.lost>2.5){ d.state='wander'; d.path=[]; } }
      d.repath-=dt;
      if (d.repath<=0){ d.repath=0.3; d.path = bfs(dt0.x,dt0.y,Math.floor(p.x),Math.floor(p.y))||[]; }
      if (dp<0.6){ p.slowT=0.6; d.face=Math.atan2(p.y-d.y,p.x-d.x); }
      else moveAlong(d, 3.0, dt);
    } else if (moveAlong(d, 1.8, dt)){
      const t = randTile(pick(L.others)); d.path = bfs(dt0.x,dt0.y,t.x,t.y)||[];
    }
  }
  // --- decoys: land, then beep three times
  for (const dc of L.decoys){
    dc.t += dt;
    if (dc.t>0.6 && dc.t-0.6 >= dc.beeps*0.8 && dc.beeps<3){ dc.beeps++; SFX.decoy(); noise(dc.x,dc.y,5.5); }
  }
  L.decoys = L.decoys.filter(dc=>dc.t<3.2);
  // --- detection / alarm
  if (!L.alarm){
    if (detRate>0){
      if (L.det<0.05 && L.huhT<=0){ SFX.huh(); L.huhT=1.5; }
      L.det += detRate*dt*G.stealth*(sprint&&moving?1.4:1);
    }
    else L.det = Math.max(0, L.det - 0.3*dt);
    if (L.det>=1) triggerAlarm();
  } else {
    L.police -= dt;
    L.sirenT -= dt; if (L.sirenT<=0){ L.sirenT=0.9; SFX.siren(); }
    if (L.police<=0){ endRun(false, 'SWAT stormed the building.'); return; }
  }
}

// ---------- actions ----------
function doAct(){ if (state==='play' && dist(L.player,L.van)<1.3) escapeFloor(); }
function doSmoke(){ if (state!=='play'||G.smoke<=0) return; const p=L.player; G.smoke--; L.smokes.push({x:p.x,y:p.y,r:2.4,t:6}); say(p.x,p.y-1,'SMOKE','#aab'); SFX.smoke(); }
function doEmp(){ if (state!=='play'||G.emp<=0) return; const p=L.player; G.emp--; L.empT=10; say(p.x,p.y-1,'EMP','#6cf'); SFX.emp(); }
function doDisguise(){ if (state!=='play'||G.disguise<=0||L.disgT>0) return; const p=L.player; G.disguise--; L.disgT=8; say(p.x,p.y-1,'UNIFORM ON','#8fb4ff'); SFX.disg(); }
function doDecoy(){
  if (state!=='play'||G.decoy<=0) return;
  const p=L.player, cx=Math.cos(p.face), cy=Math.sin(p.face);
  let t=0.5; while (t<4.5 && !solid(p.x+cx*(t+0.3), p.y+cy*(t+0.3))) t+=0.1;
  G.decoy--; L.decoys.push({x:p.x+cx*t, y:p.y+cy*t, t:0, beeps:0}); SFX.throw();
}
function toggleMute(){ muted=!muted; store.set('nsh_mute', muted?'1':'0'); if (!muted){ audioOn(); SFX.click(); } }

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.code]=true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code==='KeyM' && !e.repeat){ toggleMute(); if (state==='paused'||state==='title') (state==='title'?showTitle:showPause)(); }
  if (state!=='play' || e.repeat) return;
  if (e.code==='KeyE'||e.code==='Space') doAct();
  if (e.code==='KeyQ') doSmoke();
  if (e.code==='KeyF') doEmp();
  if (e.code==='KeyR') doDecoy();
  if (e.code==='KeyC') doDisguise();
  if (e.code==='Escape') togglePause();
});
addEventListener('keyup', e => { keys[e.code]=false; });
addEventListener('blur', () => { for (const k in keys) keys[k]=false; touchAct=false; if (state==='play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state==='play') togglePause(); });

// touch: joystick + buttons
const stick = {active:false,id:null,x:0,y:0,mag:0};
let touchAct = false;
const $ = id => document.getElementById(id);
const stickEl = $('stick'), knob = $('knob');
const bAct=$('bAct'), bSmoke=$('bSmoke'), bEmp=$('bEmp'), bDecoy=$('bDecoy'), bDisg=$('bDisg');
function stickMove(e){
  const r = stickEl.getBoundingClientRect(), R = r.width/2;
  let dx = e.clientX-(r.left+R), dy = e.clientY-(r.top+R);
  const d = Math.hypot(dx,dy), lim = Math.min(d, R);
  if (d>0){ dx = dx/d*lim; dy = dy/d*lim; }
  stick.x = dx/R; stick.y = dy/R; stick.mag = lim/R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  knob.classList.toggle('sprint', stick.mag>0.93);
}
function stickEnd(e){
  if (e.pointerId!==stick.id) return;
  stick.active=false; stick.id=null; stick.x=stick.y=stick.mag=0;
  knob.style.transform=''; knob.classList.remove('sprint');
}
stickEl.addEventListener('pointerdown', e => { e.preventDefault(); stick.active=true; stick.id=e.pointerId; stickEl.setPointerCapture(e.pointerId); stickMove(e); });
stickEl.addEventListener('pointermove', e => { if (e.pointerId===stick.id) stickMove(e); });
stickEl.addEventListener('pointerup', stickEnd);
stickEl.addEventListener('pointercancel', stickEnd);
bAct.addEventListener('pointerdown', e => { e.preventDefault(); bAct.setPointerCapture(e.pointerId); touchAct=true; bAct.classList.add('on'); doAct(); });
const actUp = () => { touchAct=false; bAct.classList.remove('on'); };
bAct.addEventListener('pointerup', actUp); bAct.addEventListener('pointercancel', actUp);
const tap = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
tap(bSmoke, doSmoke); tap(bEmp, doEmp); tap(bDecoy, doDecoy); tap(bDisg, doDisguise); tap($('bPause'), () => togglePause());
addEventListener('touchstart', () => { if (!TOUCH){ TOUCH=true; layout(); if (state==='title') showTitle(); } }, {passive:true});
addEventListener('contextmenu', e => e.preventDefault());
let uiCache='';
function syncTouchUI(){
  if (!TOUCH || state!=='play') return;
  const p=L.player;
  const lbl = dist(p,L.van)<1.3 ? 'ESCAPE' : L.actTarget==='safe' ? 'HOLD<br>CRACK' : L.actTarget ? 'HOLD<br>PICK' : 'ACT';
  const key = [lbl,G.smoke,G.emp,G.decoy,G.disguise,L.disgT>0].join('|');
  if (key===uiCache) return; uiCache=key;
  bAct.innerHTML = lbl; bAct.classList.toggle('hot', lbl!=='ACT');
  const set=(el,name,n,dis)=>{ el.innerHTML=`${name}<br>${n}`; el.disabled = dis; };
  set(bSmoke,'SMOKE',G.smoke,G.smoke<=0); set(bEmp,'EMP',G.emp,G.emp<=0);
  set(bDecoy,'DECOY',G.decoy,G.decoy<=0); set(bDisg,'DISG',G.disguise,G.disguise<=0||L.disgT>0);
}

// ---------- flow ----------
function setOverlay(html){ panel.innerHTML=html; ov.classList.remove('hide'); ov.scrollTop=0; document.body.classList.add('menu'); }
function hideOverlay(){ ov.classList.add('hide'); document.body.classList.remove('menu'); uiCache=''; }
const soundBtn = () => `<button class="ghost" data-act="mute">Sound: ${muted?'Off':'On'}</button>`;

function showCrew(){
  state='crew';
  setOverlay(`<h2>Choose your crew</h2><p>Bigger best hauls unlock new specialists.</p>
    <div class="cards crew">${CREW.map(c=>{ const ok=best>=c.need; return `<button class="card" data-act="crew" data-id="${c.id}" ${ok?'':'disabled'}>
      <div class="n">${c.name}</div><div class="d">${c.desc}</div>
      ${ok?'':`<div class="c bad">Best haul of ${fmt(c.need)} to unlock</div>`}</button>`; }).join('')}</div>`);
}

function showPerk(){
  state='perk';
  const opts = shuffle(UPG.slice()).slice(0,3);
  setOverlay(`<h2>Pick a specialty</h2><p>One free perk to start the run.</p>
    <div class="cards">${opts.map(u=>`<button class="card" data-act="perk" data-id="${u.id}"><div class="n">${u.name}</div><div class="d">${u.desc}</div></button>`).join('')}</div>`);
}

function startFloor(){
  genLevel();
  state='play'; hideOverlay();
  say(L.player.x, L.player.y-1.2, BANKS[G.floor], '#f2c14e');
  if (L.boss) say(L.player.x, L.player.y-2.2, 'FINAL JOB · two-stage vault', '#e5484d');
}

function escapeFloor(){
  const p=L.player;
  const ghost = !L.alarmEver ? Math.round(p.carry*0.25) : 0;
  const total = p.carry + ghost;
  G.bank += total; G.earned += total; G.floor++;
  G.lastSummary = {haul:p.carry, ghost, bank:BANKS[G.floor-1]};
  SFX.escape();
  if (G.floor>=BANKS.length){ endRun(true); return; }
  showShop();
}

function showShop(){
  state='shop';
  G.shop = shuffle(UPG.slice()).slice(0,4).map(u=>({...u, cost:Math.round(u.cost*(1+G.floor*0.25)/100)*100, sold:false}));
  renderShop(G.lastSummary);
}
function renderShop(s){
  setOverlay(`<h2>Safehouse</h2>
    <p>${s.bank}: <span class="money">${fmt(s.haul)}</span>${s.ghost?` + ghost bonus <span class="money">${fmt(s.ghost)}</span>`:''}</p>
    <p class="stat">Stash: <span class="money">${fmt(G.bank)}</span> · Lives ${G.lives} · Smoke ${G.smoke} · Decoy ${G.decoy} · Uniform ${G.disguise} · EMP ${G.emp}</p>
    <div class="cards">${G.shop.map((u,i)=>`<button class="card" data-act="buy" data-i="${i}" ${u.sold||u.cost>G.bank?'disabled':''}>
      <div class="n">${u.name}</div><div class="d">${u.desc}</div><div class="c ${u.cost>G.bank&&!u.sold?'bad':'money'}">${u.sold?'Bought':fmt(u.cost)}</div></button>`).join('')}</div>
    <p>Next: <span class="stat">${BANKS[G.floor]}</span> (job ${G.floor+1}/${BANKS.length})${G.floor===BANKS.length-1?' · <span class="bad">final job</span>':''}</p>
    <button class="go" data-act="next">Next job</button>`);
}

function endRun(win, why=''){
  state='over';
  win ? SFX.escape() : SFX.bust();
  const score = G.earned, old = best;
  const newBest = score>best; if (newBest){ best=score; store.set('nsh_best',best); }
  const unlocked = CREW.filter(c => c.need>old && c.need<=best);
  setOverlay(`<h1 style="color:${win?'var(--ok)':'var(--danger)'}">${win?'CLEAN GETAWAY':'BUSTED'}</h1>
    <p>${win?'You hit all five banks and vanished.':why}</p>
    <p class="stat">Jobs completed: ${G.floor}/${BANKS.length} · Crew: ${G.crew}</p>
    <p class="stat">Total take: <span class="money">${fmt(score)}</span>${newBest?' · <span class="unlock">new best!</span>':''}</p>
    ${unlocked.map(c=>`<p class="unlock">Unlocked: ${c.name}</p>`).join('')}
    <button class="go" data-act="start">New run</button>`);
}

function showPause(){ setOverlay(`<h2>Paused</h2><button class="go" data-act="resume">Resume</button><br>${soundBtn()}<button class="ghost" data-act="quit">Quit run</button>`); }
function togglePause(){
  if (state==='play'){ state='paused'; showPause(); }
  else if (state==='paused'){ state='play'; hideOverlay(); }
}

panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  SFX.click();
  if (act==='start'){ showCrew(); }
  else if (act==='crew'){
    const c = CREW.find(c=>c.id===b.dataset.id);
    G = {floor:0,bank:0,earned:0,lives:2,speed:1,bagMult:1,crack:1,pick:1,smoke:1,emp:0,decoy:1,disguise:0,stealth:1,policeBonus:0,quiet:1,lootMult:1,crew:c.name};
    c.apply(G); showPerk();
  }
  else if (act==='perk'){ UPG.find(u=>u.id===b.dataset.id).apply(G); startFloor(); }
  else if (act==='buy'){ const u=G.shop[+b.dataset.i]; if (!u.sold && G.bank>=u.cost){ G.bank-=u.cost; u.sold=true; u.apply(G); renderShop(G.lastSummary); } }
  else if (act==='next'){ startFloor(); }
  else if (act==='resume'){ togglePause(); }
  else if (act==='quit'){ endRun(false, 'You called it off and laid low.'); }
  else if (act==='mute'){ toggleMute(); state==='title' ? showTitle() : showPause(); }
});

// ---------- render ----------
function draw(){
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  ctx.fillStyle='#0b0d14'; ctx.fillRect(0,0,V.w,V.h);
  if (!L) return;
  const sc=V.scale, mw=W*T*sc, mh=H*T*sc;
  const camX = mw<=V.vw ? (V.vw-mw)/2 : Math.min(0, Math.max(V.vw-mw, V.vw/2 - L.player.x*T*sc));
  const camY = mh<=V.vh ? (V.vh-mh)/2 : Math.min(0, Math.max(V.vh-mh, V.vh/2 - L.player.y*T*sc));
  ctx.save(); ctx.beginPath(); ctx.rect(V.vx,V.vy,V.vw,V.vh); ctx.clip();
  ctx.translate(V.vx+camX, V.vy+camY); ctx.scale(sc,sc);
  // tiles
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    if (grid[y][x]){
      ctx.fillStyle='#0d1018'; ctx.fillRect(x*T,y*T,T,T);
      if (y+1<H && !grid[y+1][x]){ ctx.fillStyle='#39425a'; ctx.fillRect(x*T,y*T+T-8,T,8); }
    } else {
      ctx.fillStyle=(x+y)%2?'#232a3b':'#262e40'; ctx.fillRect(x*T,y*T,T,T);
    }
  }
  const P = v => v*T;
  const p = L.player, s = L.safe, K = TOUCH?'ACT':'[E]';
  ctx.textAlign='center';
  // doors
  for (const d of L.doors){
    const x=d.x*T, y=d.y*T;
    if (d.locked){
      ctx.fillStyle='rgba(120,190,230,0.22)'; ctx.fillRect(x+2,y+2,T-4,T-4);
      ctx.strokeStyle='#7fb8d8'; ctx.lineWidth=2; ctx.strokeRect(x+2,y+2,T-4,T-4);
      ctx.fillStyle='#f2c14e'; ctx.fillRect(x+T/2-5,y+T/2-1,10,8);
      ctx.strokeStyle='#f2c14e'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+T/2,y+T/2-1,4,Math.PI,0); ctx.stroke();
      if (d.prog>0){ ctx.strokeStyle='#f2c14e'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+T/2,y+T/2,14,-Math.PI/2,-Math.PI/2+d.prog*Math.PI*2); ctx.stroke(); }
    } else { ctx.strokeStyle='rgba(127,184,216,0.35)'; ctx.lineWidth=1; ctx.strokeRect(x+3,y+3,T-6,T-6); }
  }
  // van
  const v=L.van, nearVan = dist(p,v)<1.3;
  ctx.fillStyle='#2f6b4a'; ctx.fillRect(P(v.x)-14,P(v.y)-12,28,24);
  ctx.fillStyle='#bfe8cf'; ctx.font='bold 9px monospace'; ctx.fillText('VAN',P(v.x),P(v.y)+3);
  // cash
  for (const c of L.cash) if (!c.taken){
    const by = Math.sin(L.time*3+c.bob)*1.5;
    ctx.fillStyle='#2e8b57'; ctx.fillRect(P(c.x)-9,P(c.y)-6+by,18,12);
    ctx.fillStyle='#c8f5d5'; ctx.font='bold 10px monospace'; ctx.fillText('$',P(c.x),P(c.y)+4+by);
  }
  // vault
  const vs = L.boss ? 17 : 13;
  ctx.fillStyle=s.done?'#4a4430':'#b8922f'; ctx.fillRect(P(s.x)-vs,P(s.y)-vs,vs*2,vs*2);
  ctx.strokeStyle='#1a1405'; ctx.lineWidth=2; ctx.strokeRect(P(s.x)-vs,P(s.y)-vs,vs*2,vs*2);
  ctx.beginPath(); ctx.arc(P(s.x),P(s.y),6,0,7); ctx.stroke();
  if (L.boss && !s.done){ ctx.beginPath(); ctx.arc(P(s.x),P(s.y),11,0,7); ctx.stroke();
    ctx.fillStyle='#f2c14e'; ctx.font='bold 10px monospace'; ctx.fillText(`VAULT ${s.stage+1}/2`,P(s.x),P(s.y)+vs+12); }
  if (!s.done && s.prog>0){ ctx.strokeStyle='#f2c14e'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(P(s.x),P(s.y),vs+7,-Math.PI/2,-Math.PI/2+s.prog*Math.PI*2); ctx.stroke(); }
  // lasers
  for (const l of L.lasers){
    const on = laserOn(l), ph = laserPhase(l), warn = !on && L.empT<=0 && ph > l.on+l.off-0.45;
    const [x1,y1,x2,y2] = l.horiz ? [P(l.a),P(l.c),P(l.b),P(l.c)] : [P(l.c),P(l.a),P(l.c),P(l.b)];
    ctx.fillStyle='#555c70'; ctx.fillRect(x1-3,y1-3,6,6); ctx.fillRect(x2-3,y2-3,6,6);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    if (on){ ctx.strokeStyle='rgba(255,40,60,0.25)'; ctx.lineWidth=8; ctx.stroke(); ctx.strokeStyle='#ff4757'; ctx.lineWidth=2; ctx.stroke(); }
    else { ctx.setLineDash([4,6]); ctx.strokeStyle= warn && Math.floor(L.time*12)%2 ? 'rgba(255,71,87,0.8)' : 'rgba(255,71,87,0.18)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]); }
  }
  // cones
  const coneCol = L.alarm ? 'rgba(229,72,77,0.18)' : `rgba(255,${Math.round(220-L.det*150)},90,${0.12+L.det*0.12})`;
  const fillCone = pts => { ctx.beginPath(); ctx.moveTo(P(pts[0][0]),P(pts[0][1])); for (const q of pts) ctx.lineTo(P(q[0]),P(q[1])); ctx.closePath(); ctx.fill(); };
  ctx.fillStyle=coneCol;
  for (const g of L.guards) if (g.blind<=0) fillCone(conePoly(g,g.face,G_RANGE,G_HALF));
  for (const c of L.cams) if (L.empT<=0) fillCone(conePoly(c,c.ang,C_RANGE,C_HALF));
  // dog noses: a faint scent circle
  for (const d of L.dogs) if (d.blind<=0){ ctx.strokeStyle='rgba(200,150,90,0.25)'; ctx.setLineDash([3,5]); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(P(d.x),P(d.y),P(DOG_NOSE),0,7); ctx.stroke(); ctx.setLineDash([]); }
  // cameras
  for (const c of L.cams){
    ctx.save(); ctx.translate(P(c.x),P(c.y)); ctx.rotate(c.ang);
    ctx.fillStyle=L.empT>0?'#444':'#9aa3b8'; ctx.fillRect(-7,-5,14,10);
    ctx.fillStyle=L.empT>0?'#222':(c.sees?'#e5484d':'#3c3'); ctx.fillRect(5,-3,4,6);
    ctx.restore();
  }
  // decoys
  for (const dc of L.decoys){
    ctx.fillStyle='#5b6275'; ctx.beginPath(); ctx.arc(P(dc.x),P(dc.y),5,0,7); ctx.fill();
    ctx.fillStyle=Math.floor(L.time*6)%2?'#ff4757':'#5b1018'; ctx.beginPath(); ctx.arc(P(dc.x),P(dc.y),2,0,7); ctx.fill();
  }
  // smoke
  for (const sm of L.smokes){
    const a = Math.min(1, sm.t/1.5)*0.75;
    ctx.fillStyle=`rgba(150,155,170,${a*0.35})`;
    for (let i=0;i<6;i++){ const ang=i+L.time*0.3, rr=sm.r*0.45;
      ctx.beginPath(); ctx.arc(P(sm.x+Math.cos(ang)*rr),P(sm.y+Math.sin(ang)*rr),P(sm.r*0.6),0,7); ctx.fill(); }
  }
  // guards
  ctx.font='bold 14px monospace';
  for (const g of L.guards){
    ctx.fillStyle = g.state==='chase'?'#d14b4b':'#4c7fd9';
    ctx.beginPath(); ctx.arc(P(g.x),P(g.y),10,0,7); ctx.fill();
    ctx.fillStyle='#0b0d14'; ctx.beginPath(); ctx.arc(P(g.x)+Math.cos(g.face)*6,P(g.y)+Math.sin(g.face)*6,3,0,7); ctx.fill();
    if (g.blind>0){ ctx.fillStyle='#ccc'; ctx.fillText('?',P(g.x),P(g.y)-14); }
    else if (g.sees || g.state==='chase'){ ctx.fillStyle='#e5484d'; ctx.fillText('!',P(g.x),P(g.y)-14); }
    else if (g.state==='investigate'||g.state==='look'){ ctx.fillStyle='#f2c14e'; ctx.fillText('?',P(g.x),P(g.y)-14); }
  }
  // dogs
  for (const d of L.dogs){
    const x=P(d.x), y=P(d.y), cx=Math.cos(d.face), cy=Math.sin(d.face);
    ctx.fillStyle='#8a5a2b'; ctx.beginPath(); ctx.ellipse(x,y,9,6,d.face,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+cx*9,y+cy*9,5,0,7); ctx.fill();
    ctx.fillStyle='#2a1a0c'; ctx.beginPath(); ctx.arc(x+cx*13,y+cy*13,2,0,7); ctx.fill();
    if (d.blind>0){ ctx.fillStyle='#ccc'; ctx.fillText('?',x,y-12); }
    else if (d.state==='track'){ ctx.fillStyle='#e5484d'; ctx.fillText('!',x,y-12); }
  }
  // player
  if (p.weight>0){ const bs=6+Math.min(p.weight,12); ctx.fillStyle='#6b5a3a';
    ctx.beginPath(); ctx.arc(P(p.x)-Math.cos(p.face)*8,P(p.y)-Math.sin(p.face)*8,bs*0.6,0,7); ctx.fill(); }
  const disg = L.disgT>0;
  ctx.fillStyle=disg?'#7fa0e0':'#46c37b'; ctx.beginPath(); ctx.arc(P(p.x),P(p.y),9,0,7); ctx.fill();
  if (disg){ ctx.fillStyle='#1d2a4a'; ctx.fillRect(P(p.x)-8,P(p.y)-9,16,5); }
  else { ctx.fillStyle='#0b0d14'; ctx.fillRect(P(p.x)-6,P(p.y)-3,12,4); }
  // noise rings
  for (const r of L.rings){ ctx.strokeStyle=`rgba(242,193,78,${0.5-r.t*0.8})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(P(r.x),P(r.y),P(r.r)*(r.t/0.6),0,7); ctx.stroke(); }
  // prompts
  ctx.font='bold 12px monospace';
  if (nearVan){ ctx.fillStyle='#bfe8cf'; ctx.fillText(`${K} ESCAPE with ${fmt(p.carry)}`,P(v.x)+40,P(v.y)-18); }
  if (L.actTarget==='safe'){ ctx.fillStyle='#f2c14e'; ctx.fillText(`HOLD ${K} to crack`, P(s.x), P(s.y)-vs-12); }
  else if (L.actTarget){ ctx.fillStyle='#f2c14e'; ctx.fillText(`HOLD ${K} to pick`, P(L.actTarget.x+0.5), P(L.actTarget.y)-6); }
  // floating text
  ctx.font='bold 13px monospace';
  for (const t of L.texts){ ctx.globalAlpha=Math.min(1,t.t); ctx.fillStyle=t.color; ctx.fillText(t.txt,P(t.x),P(t.y)); }
  ctx.globalAlpha=1;
  ctx.restore();

  if (L.alarm){ const a=0.12+0.1*Math.sin(L.time*8); ctx.strokeStyle=`rgba(229,72,77,${a})`; ctx.lineWidth=14; ctx.strokeRect(V.vx+7,V.vy+7,V.vw-14,V.vh-14); }
  if (L.flash>0){ ctx.fillStyle=`rgba(229,72,77,${L.flash*0.5})`; ctx.fillRect(V.vx,V.vy,V.vw,V.vh); }
  drawHUD(p);
}

function drawHUD(p){
  const HUD=V.hud, VWd=V.w;
  ctx.fillStyle='#10141f'; ctx.fillRect(0,0,VWd,HUD);
  ctx.fillStyle='#2a3247'; ctx.fillRect(0,HUD-2,VWd,2);
  const timers = [L.disgT>0?`UNIFORM ${L.disgT.toFixed(0)}s`:'', L.empT>0?`EMP ${L.empT.toFixed(0)}s`:''].filter(Boolean).join('  ');
  const detCol = L.det>0.66?'#e5484d':L.det>0.33?'#f2a14e':'#f2c14e';
  if (V.narrow){
    const padL = 12, padR = VWd-12;
    ctx.textAlign='left'; ctx.font='bold 14px monospace'; ctx.fillStyle='#f2c14e';
    ctx.fillText(`JOB ${G.floor+1}/${BANKS.length}`,padL,22);
    ctx.fillStyle='#e5484d'; ctx.fillText('♥'.repeat(Math.min(G.lives,5)),padL+92,22);
    ctx.textAlign='right'; ctx.fillStyle='#46c37b'; ctx.fillText(`BAG ${fmt(p.carry)}`,padR,22);
    ctx.font='12px monospace'; ctx.fillText(`STASH ${fmt(G.bank)}`,padR,46);
    const bw = Math.max(80, VWd*0.42);
    ctx.textAlign='left';
    if (L.alarm){ ctx.fillStyle='#e5484d'; ctx.font='bold 14px monospace'; ctx.fillText(`POLICE ${Math.max(0,L.police).toFixed(1)}s`,padL,47); }
    else { ctx.fillStyle='#232a3b'; ctx.fillRect(padL,37,bw,10); ctx.fillStyle=detCol; ctx.fillRect(padL,37,bw*Math.min(1,L.det),10); }
    if (timers){ ctx.fillStyle='#8fb4ff'; ctx.font='10px monospace'; ctx.fillText(timers, L.alarm?padL+130:padL+bw+6, 47); }
    return;
  }
  ctx.textAlign='left'; ctx.font='bold 15px monospace'; ctx.fillStyle='#f2c14e';
  ctx.fillText(`JOB ${G.floor+1}/${BANKS.length}`,16,24);
  ctx.font='13px monospace'; ctx.fillStyle='#8d93a5'; ctx.fillText(BANKS[G.floor],16,44);
  const cx=VWd/2;
  ctx.textAlign='center';
  if (L.alarm){
    ctx.fillStyle='#e5484d'; ctx.font='bold 20px monospace';
    ctx.fillText(`POLICE IN ${Math.max(0,L.police).toFixed(1)}s`,cx,32);
  } else {
    ctx.fillStyle='#8d93a5'; ctx.font='11px monospace'; ctx.fillText('DETECTION',cx,16);
    ctx.fillStyle='#232a3b'; ctx.fillRect(cx-110,24,220,14);
    ctx.fillStyle=detCol; ctx.fillRect(cx-110,24,220*Math.min(1,L.det),14);
  }
  if (timers){ ctx.fillStyle='#8fb4ff'; ctx.font='11px monospace'; ctx.fillText(timers,cx,52); }
  ctx.textAlign='right'; ctx.font='bold 14px monospace';
  ctx.fillStyle='#46c37b'; ctx.fillText(`BAG ${fmt(p.carry)}  STASH ${fmt(G.bank)}`,VWd-16,24);
  ctx.fillStyle='#e8e6df'; ctx.font='12px monospace';
  ctx.fillText(TOUCH ? `♥ ${G.lives}` : `♥${G.lives}  Q:${G.smoke} R:${G.decoy} C:${G.disguise} F:${G.emp}`,VWd-16,44);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (state==='play') update(dt);
  syncTouchUI();
  draw();
  requestAnimationFrame(frame);
}
layout();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
